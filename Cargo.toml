[package]
description = "A Rust reimplementation of the watchgha."
edition = "2024"
license-file = "LICENSE.txt"
name = "watchgha"
repository = "https://github.com/zydou/watchgha-rs"
version = "2.7.0"

[[bin]]
name = "watchgha"
path = "src/main.rs"

[profile.dev]
debug = "line-tables-only"
opt-level = 1

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
panic = "abort"
strip = true

[dependencies]
base64 = "0.23.1"
clap = { version = "4.6.10", features = ["derive"] }
ctrlc = { version = "3.5.3", default-features = false, features = [
  "termination",
] }
jiff = "1.0.3"
libc = "0.2"
regex = "1.13.2"
reqwest = { version = "0.13.5", default-features = false, features = [
  "blocking",
  "rustls-no-provider",
] }
# Bring the lighter `ring` crypto provider (no cmake) instead of reqwest's
# default `aws-lc-rs`, which fails to cross-build for musl in CI.
rustls = { version = "0.23", default-features = false, features = [
  "ring",
  "std",
  "tls12",
] }
# `preserve_order` makes `serde_json::Map` insertion-ordered (IndexMap-backed),
# matching Python's insertion-ordered dict: the original iterates
# `resp.json().items()` and emits error-body fields in document order, so the
# port must not sort them (see PLAN.md B-2).
serde_json = { version = "1.0.154", features = ["preserve_order"] }
url = "2.5.9"
